services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: course_radar
      POSTGRES_PASSWORD: course_radar
      POSTGRES_DB: course_radar
    ports:
      - "5432:5432"
    volumes:
      - course_radar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course_radar -d course_radar"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://course_radar:course_radar@postgres:5432/course_radar?schema=public
      PORT: 3001
      WEB_ORIGIN: http://localhost:5173
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  course_radar_pgdata:
