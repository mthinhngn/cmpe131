name: SJSU schedule refresh

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sjsu-schedule-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements-import.txt
      - name: Refresh the three public schedules
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/import_sjsu.py --schedules-only --write-db --output "$RUNNER_TEMP/sjsu"
      - name: Upload refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sjsu-refresh-report
          path: ${{ runner.temp }}/sjsu/report.json
